# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.11"
  jobs:
    # From https://docs.readthedocs.com/platform/stable/build-customization.html#support-git-lfs-large-file-storage
    post_checkout:
      - wget https://github.com/git-lfs/git-lfs/releases/download/v3.8.1/git-lfs-linux-amd64-v3.8.1.tar.gz
      - tar xvfz git-lfs-linux-amd64-v3.8.1.tar.gz --strip-components 1 git-lfs-3.8.1/git-lfs
      - git config filter.lfs.process "$(pwd)/git-lfs filter-process"
      - git config filter.lfs.smudge  "$(pwd)/git-lfs smudge -- %f"
      - git config filter.lfs.clean "$(pwd)/git-lfs clean -- %f"
      - ./git-lfs install
      - ./git-lfs fetch
      - ./git-lfs checkout
    install:
      - pip install -r requirements.txt -r requirements-docs.txt
      - pip install -e .

sphinx:
  configuration: docs/conf.py
  builder: html

formats:
  - epub
  - pdf
